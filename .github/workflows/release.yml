name: Lançamento

# Crie uma tag (ex.: v1.0.0) para publicar uma versão com o APK e o jogo em arquivo único.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs --android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android assembleDebug
      - name: Renomeia arquivos
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Deadzone-${GITHUB_REF_NAME}.apk"
          cp dist/Deadzone.html "Deadzone-${GITHUB_REF_NAME}.html"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Deadzone-*.apk
            Deadzone-*.html
          generate_release_notes: true
