name: Lançamento

# Publica uma versão com o APK e o jogo em arquivo único.
# Use: crie uma tag (ex.: v1.0.0) ou rode em Actions → Lançamento → Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  DZ_KS_PASS: dz-${{ github.repository_id }}-key

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build.mjs --android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chave de assinatura (guardada no cache do GitHub, fora do código)
        uses: actions/cache@v4
        with:
          path: .signing/deadzone.jks
          key: deadzone-signing-key-v1
      - name: Cria a chave na primeira vez
        run: |
          mkdir -p .signing
          if [ ! -f .signing/deadzone.jks ]; then
            keytool -genkeypair -keystore .signing/deadzone.jks -storepass "$DZ_KS_PASS" -keypass "$DZ_KS_PASS" \
              -alias deadzone -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Deadzone, O=Deadzone, C=BR"
          fi
          echo "DZ_KEYSTORE=$PWD/.signing/deadzone.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android assembleRelease
      - name: Renomeia arquivos
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Deadzone-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "Deadzone.apk"
          cp dist/Deadzone.html "Deadzone-${VERSION}.html"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Deadzone ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            Deadzone.apk
            Deadzone-*.apk
            Deadzone-*.html
          generate_release_notes: true
