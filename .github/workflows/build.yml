name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Jogo web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (verifica sintaxe e gera dist/)
        run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Deadzone-web
          path: dist/
          retention-days: 14

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copia o jogo para o app
        run: node tools/build.mjs --android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reaproveita a chave de assinatura (mesma assinatura em todas as versões)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: deadzone-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compila o APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Deadzone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
