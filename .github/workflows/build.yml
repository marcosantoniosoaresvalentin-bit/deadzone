name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DZ_KS_PASS: dz-${{ github.repository_id }}-key

permissions:
  contents: read

jobs:
  web:
    name: Jogo web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (verifica sintaxe e gera dist/)
        run: node tools/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Deadzone-web
          path: dist/
          retention-days: 14

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copia o jogo para o app
        run: node tools/build.mjs --android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chave de assinatura (guardada no cache do GitHub, fora do código)
        uses: actions/cache@v4
        with:
          path: .signing/deadzone.jks
          key: deadzone-signing-key-v1
      - name: Cria a chave na primeira vez
        run: |
          mkdir -p .signing
          if [ ! -f .signing/deadzone.jks ]; then
            keytool -genkeypair -keystore .signing/deadzone.jks -storepass "$DZ_KS_PASS" -keypass "$DZ_KS_PASS" \
              -alias deadzone -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Deadzone, O=Deadzone, C=BR"
          fi
          echo "DZ_KEYSTORE=$PWD/.signing/deadzone.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compila o APK
        run: gradle -p android assembleRelease
      - name: Verifica o APK (assinatura, manifesto e conteúdo)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== apksigner"; "$BT/apksigner" verify --verbose --print-certs "$APK" || true
          echo "== badging"; "$BT/aapt2" dump badging "$APK" | head -40 || true
          echo "== manifesto"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | head -80 || true
          echo "== arquivos"; unzip -l "$APK" | awk '{print $4}' | grep -v '^assets/www/src/js' | head -80
          echo "== total"; unzip -l "$APK" | tail -1
          echo "== zipalign"; "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Deadzone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
