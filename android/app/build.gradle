plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deadzone.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deadzone.game'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // o modelo .glb e as texturas não devem ser recomprimidos
    androidResources {
        noCompress += ['glb', 'jpg', 'png']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
