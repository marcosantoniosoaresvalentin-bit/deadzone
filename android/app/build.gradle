plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deadzone.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deadzone.game'
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName '3.7.0'
    }

    // Assinatura: no GitHub Actions a chave vem do cache (variáveis DZ_KEYSTORE/DZ_KS_PASS);
    // no computador, sem essas variáveis, usa a chave de depuração padrão.
    signingConfigs {
        deadzone {
            def ks = System.getenv('DZ_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DZ_KS_PASS')
                keyAlias 'deadzone'
                keyPassword System.getenv('DZ_KS_PASS')
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
            // v1 + v2 + v3: alguns celulares (ex.: Xiaomi) recusam APK só com v2
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.deadzone
        }
    }

    // a verificação "lint" baixa muitas dependências e falha quando o Maven Central limita (erro 429)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // o modelo .glb e as texturas não devem ser recomprimidos
    androidResources {
        noCompress += ['glb', 'jpg', 'png']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
